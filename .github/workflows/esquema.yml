# Verifica que database/schema.sql recrea la base desde cero (RNF-19) y que
# la base hace cumplir las restricciones del Modelo de Datos.
name: Esquema de la base

on:
  pull_request:
    paths:
      - "database/**"
      - ".github/workflows/esquema.yml"
  push:
    branches: [main]
    paths:
      - "database/**"
      - ".github/workflows/esquema.yml"

jobs:
  esquema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4

      - name: Crear el esquema sobre una base vacía
        run: psql -v ON_ERROR_STOP=1 -f database/schema.sql

      - name: Verificar las restricciones
        run: psql -v ON_ERROR_STOP=1 -f database/pruebas/verificar_esquema.sql
