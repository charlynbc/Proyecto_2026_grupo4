# Compila y prueba el backend en cada Pull Request que toque backend/api o el
# esquema de la base. Si algo falla, el PR queda en rojo antes de mergear. La
# imagen Docker se construye en el workflow Imagen.
name: Backend

on:
  pull_request:
    paths:
      - "backend/api/**"
      - "database/schema.sql"
      - ".github/workflows/backend.yml"
  push:
    branches: [main, integracion/proyecto-2026-avances]
    paths:
      - "backend/api/**"
      - "database/schema.sql"
      - ".github/workflows/backend.yml"

jobs:
  pruebas:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/api
    services:
      # Las pruebas levantan el contexto de Spring, que necesita una base.
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_URL: jdbc:postgresql://localhost:5432/postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
      # Clave solo para las pruebas: 32 bytes en base64, sin valor real.
      JWT_SECRET_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      APP_FIREBASE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # Las pruebas que levantan Spring usan esta base. Sin el esquema, lo que
      # corre en segundo plano (el poller de notificaciones) no encuentra sus
      # tablas y llena el log de errores, aunque las pruebas pasen.
      - name: Cargar el esquema
        working-directory: .
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: psql -v ON_ERROR_STOP=1 -f database/schema.sql

      - name: Compilar y correr las pruebas
        run: ./mvnw -B verify
