<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Sistema de reserva de consultas médicas.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Médica Oriental">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Médica Oriental</title>
  <link rel="manifest" href="manifest.json">

  <!-- legacy-hash:inicio -->
  <script>
    // Compatibilidad con los enlaces viejos de los correos, que llevaban #:
    // /#/primer-ingreso?token=X pasa a /primer-ingreso?token=X. Tiene que
    // correr antes de que Flutter lea la URL, así que va en línea y sin async.
    // Solo actúa en la raíz, y no acepta #//host ni #/\host (saldrían del sitio).
    (function () {
      try {
        var ubicacion = window.location;
        if (ubicacion.pathname !== '/') return;
        var hash = ubicacion.hash;
        if (hash.charAt(0) !== '#' || hash.charAt(1) !== '/') return;
        var siguiente = hash.charAt(2);
        if (siguiente === '/' || siguiente === '\\') return;
        window.history.replaceState(null, '', hash.substring(1));
      } catch (e) {
        // Sin el cambio la app abre igual, solo que en la ruta de inicio.
      }
    })();
  </script>
  <!-- legacy-hash:fin -->
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
