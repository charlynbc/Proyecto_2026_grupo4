spring.application.name=poc-backend

# Perfil para probar contra Postgres real (Supabase).
# NO hay credenciales reales acá: se leen de variables de entorno DB_URL,
# DB_USER, DB_PASSWORD (ver .env.example). Se activa con
# SPRING_PROFILES_ACTIVE=postgres. Reactiva el autoconfigure de datasource/JPA
# que en el perfil por defecto esta excluido.
spring.autoconfigure.exclude=
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
