# Sin datasource configurado (no hay credenciales reales en el repo).
# Se excluye el autoconfigure de JPA/DataSource solo para que el contexto de test cargue.
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,org.springframework.boot.data.jpa.autoconfigure.JpaRepositoriesAutoConfiguration,org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration
