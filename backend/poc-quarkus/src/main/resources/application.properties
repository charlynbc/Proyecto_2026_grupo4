quarkus.http.port=8081

# Datasource real (Supabase), solo por variables de entorno DB_URL/DB_USER/DB_PASSWORD.
# Con los valores por defecto (localhost) la app arranca igual sin romper /hola,
# porque Agroal no abre conexion hasta el primer uso.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
quarkus.datasource.username=${DB_USER:postgres}
quarkus.datasource.password=${DB_PASSWORD:postgres}
quarkus.datasource.jdbc.min-size=0
quarkus.datasource.jdbc.max-size=2
