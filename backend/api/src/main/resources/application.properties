spring.application.name=api

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

app.jwt.secret-base64=${JWT_SECRET_BASE64}
app.jwt.expiration-seconds=900
app.refresh.expiration-seconds=604800
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
app.cookie.secure=${COOKIE_SECURE:false}
app.cookie.same-site=${COOKIE_SAME_SITE:Lax}

server.port=${PORT:8080}
server.forward-headers-strategy=framework

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
# Proveedor de correo: none (por defecto, no envia), smtp (Mailpit local) o resend (HTTPS, Railway)
app.mail.provider=${MAIL_PROVIDER:none}
app.mail.resend.base-url=${RESEND_BASE_URL:https://api.resend.com}
app.mail.resend.api-key=${RESEND_API_KEY:}
app.email.from=${MAIL_FROM:no-reply@localhost}
app.email.first-login-url=${FIRST_LOGIN_URL:http://localhost:5173/#/primer-ingreso}
app.email.change-email-url=${CHANGE_EMAIL_URL:http://localhost:5173/#/cambio-correo}
app.email.recovery-url=${RECOVERY_URL:http://localhost:5173/#/recuperacion}
app.auth.password-min-length=${PASSWORD_MIN_LENGTH:8}
app.auth.first-login-token-validity-hours=${FIRST_LOGIN_TOKEN_VALIDITY_HOURS:24}
app.auth.email-change-token-validity-hours=${EMAIL_CHANGE_TOKEN_VALIDITY_HOURS:24}
app.auth.recovery-token-validity-hours=${RECOVERY_TOKEN_VALIDITY_HOURS:24}
