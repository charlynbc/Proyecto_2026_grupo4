spring.application.name=api

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

app.jwt.secret-base64=${JWT_SECRET_BASE64}
app.jwt.expiration-seconds=900
app.refresh.expiration-seconds=604800
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
app.cookie.secure=${COOKIE_SECURE:false}
app.cookie.same-site=${COOKIE_SAME_SITE:Lax}
