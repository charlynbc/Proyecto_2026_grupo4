spring.application.name=api

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

app.jwt.secret-base64=${JWT_SECRET_BASE64}
app.jwt.expiration-seconds=900
app.refresh.expiration-seconds=604800
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
app.cookie.secure=${COOKIE_SECURE:false}
app.cookie.same-site=${COOKIE_SAME_SITE:Lax}

spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.email.from=${MAIL_FROM:${MAIL_USERNAME:}}
app.email.verification-url=${EMAIL_VERIFICATION_URL:http://localhost:5173/confirmar-email}
