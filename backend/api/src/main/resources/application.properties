spring.application.name=api

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

app.jwt.secret-base64=${JWT_SECRET_BASE64}
app.jwt.expiration-seconds=900
app.refresh.expiration-seconds=604800
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
app.cookie.secure=${COOKIE_SECURE:false}
app.cookie.same-site=${COOKIE_SAME_SITE:Lax}

server.port=${PORT:8080}
server.forward-headers-strategy=framework

# Las imagenes de anuncios admiten hasta 5 MB; los CSV conservan su limite de 1 MB en su validacion.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=30MB
app.anuncios.storage.url=${SUPABASE_URL:}
app.anuncios.storage.key=${SUPABASE_SECRET_KEY:${SUPABASE_SERVICE_ROLE_KEY:}}
app.anuncios.storage.bucket=${ANUNCIOS_BUCKET:anuncios}

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
# Proveedor de correo: none (por defecto, no envia), smtp (Mailpit local) o resend (HTTPS, Railway)
app.mail.provider=${MAIL_PROVIDER:none}
app.mail.resend.base-url=${RESEND_BASE_URL:https://api.resend.com}
app.mail.resend.api-key=${RESEND_API_KEY:}
app.email.from=${MAIL_FROM:no-reply@localhost}
app.email.first-login-url=${FIRST_LOGIN_URL:http://localhost:5173/primer-ingreso}
app.email.change-email-url=${CHANGE_EMAIL_URL:http://localhost:5173/cambio-correo}
app.email.recovery-url=${RECOVERY_URL:http://localhost:5173/recuperacion}
# Android App Links: /.well-known/assetlinks.json. Las huellas SHA-256 son publicas (no son un secreto),
# separadas por comas. Por defecto, la clave debug de la maquina de Leo.
app.android.package-name=${ANDROID_APP_PACKAGE_NAME:uy.edu.fing.tecnoinf.mvd.a2026_sem2_grupo4.agenda_medica}
app.android.sha256-fingerprints=${ANDROID_APP_FINGERPRINTS:01:AC:05:8D:AC:C7:69:7C:34:98:6D:2D:8A:68:D6:D7:51:F7:F4:B3:0C:69:CB:11:0C:0C:88:8D:23:20:4F:0C}
app.auth.password-min-length=${PASSWORD_MIN_LENGTH:8}
app.auth.first-login-token-validity-hours=${FIRST_LOGIN_TOKEN_VALIDITY_HOURS:24}
app.auth.email-change-token-validity-hours=${EMAIL_CHANGE_TOKEN_VALIDITY_HOURS:24}
app.auth.recovery-token-validity-hours=${RECOVERY_TOKEN_VALIDITY_HOURS:24}

# Con false no corren los procesos programados de avisos (poller de envios).
# El backend-dev, que comparte la base con el backend, debe tenerlo en false.
app.notificaciones.procesos-programados.habilitados=${NOTIFICACIONES_PROCESOS_PROGRAMADOS_HABILITADOS:true}

# Parametros configurables (RNF-26, seccion 3.1.3 de Requerimientos). Se cambian con
# variables de entorno PARAM_*; los valores por defecto son los de esa seccion.
app.parametros.agendar-anticipacion-maxima-dias=${PARAM_AGENDAR_ANTICIPACION_MAXIMA_DIAS:30}
app.parametros.agendar-anticipacion-minima-horas=${PARAM_AGENDAR_ANTICIPACION_MINIMA_HORAS:2}
app.parametros.cancelar-anticipacion-minima-horas=${PARAM_CANCELAR_ANTICIPACION_MINIMA_HORAS:2}
app.parametros.consultas-activas-por-especialidad=${PARAM_CONSULTAS_ACTIVAS_POR_ESPECIALIDAD:1}
app.parametros.consultas-activas-total=${PARAM_CONSULTAS_ACTIVAS_TOTAL:3}
app.parametros.numero-duracion-minima-minutos=${PARAM_NUMERO_DURACION_MINIMA_MINUTOS:10}
app.parametros.numero-duracion-maxima-minutos=${PARAM_NUMERO_DURACION_MAXIMA_MINUTOS:60}
app.parametros.numero-duracion-paso-minutos=${PARAM_NUMERO_DURACION_PASO_MINUTOS:5}
app.parametros.pase-vigencia-inicial-dias=${PARAM_PASE_VIGENCIA_INICIAL_DIAS:90}
app.parametros.pase-vigencia-minima-dias=${PARAM_PASE_VIGENCIA_MINIMA_DIAS:1}
app.parametros.pase-vigencia-maxima-dias=${PARAM_PASE_VIGENCIA_MAXIMA_DIAS:365}
app.parametros.recordatorio-antelacion-horas=${PARAM_RECORDATORIO_ANTELACION_HORAS:24}
